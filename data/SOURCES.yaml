# Runtime license manifest for pilot ingestion modules.
# Every ingestion source module must have a matching entry (CI-enforced).

pilot:
  name: Southern California Bight 50-mile nowcast
  bbox:
    lat_min: 32.0
    lat_max: 35.0
    lon_min: -121.0
    lon_max: -117.0

sources:
  calcofi_cufes:
    module: fishai.ingestion.biology.calcofi_cufes
    erddap_dataset: erdCalCOFIcufes
    provider: NOAA SWFSC / CalCOFI (ERDDAP erdCalCOFIcufes)
    license: >-
      NOAA ERDDAP free-use (not CC): data may be used and redistributed for free
      but is not intended for legal use; no warranty of accuracy or fitness.
    license_url: https://oceanview.pfeg.noaa.gov/CalCOFI/calcofi_info.html
    license_text: >-
      The data may be used and redistributed for free but is not intended for
      legal use, since it may contain inaccuracies. Neither the data Contributor,
      ERD, NOAA, nor the United States Government, nor any of their employees or
      contractors, makes any warranty, express or implied, including warranties of
      merchantability and fitness for a particular purpose, or assumes any legal
      liability for the accuracy, completeness, or usefulness, of this information.
    attribution: "NOAA SWFSC / CalCOFI, erdCalCOFIcufes; https://oceanview.pfeg.noaa.gov/erddap/tabledap/erdCalCOFIcufes.html"
    status: approved
    enabled: true
    notes: >-
      Egg-stage evidence only; not adult presence. SOURCES.yaml previously listed
      CC-BY-4.0; ERDDAP metadata for erdCalCOFIcufes carries the NOAA disclaimer above.

  swfsc_cps_trawl_haul_catch:
    module: fishai.ingestion.biology.swfsc_cps_trawl_haul_catch
    erddap_dataset: FRDCPSTrawlLHHaulCatch
    provider: NOAA SWFSC FRD Coastal Pelagic Species Life History (ERDDAP FRDCPSTrawlLHHaulCatch)
    license: >-
      NOAA ERDDAP free-use (not CC): data may be used and redistributed for free
      but is not intended for legal use; no warranty of accuracy or fitness.
    license_url: https://oceanview.pfeg.noaa.gov/erddap/info/FRDCPSTrawlLHHaulCatch/index.html
    license_text: >-
      The data may be used and redistributed for free but is not intended for
      legal use, since it may contain inaccuracies. Neither the data Contributor,
      ERD, NOAA, nor the United States Government, nor any of their employees or
      contractors, makes any warranty, express or implied, including warranties of
      merchantability and fitness for a particular purpose, or assumes any legal
      liability for the accuracy, completeness, or usefulness, of this information.
    attribution: >-
      NOAA SWFSC Coastal Pelagic Species Life History Program, FRDCPSTrawlLHHaulCatch;
      https://oceanview.pfeg.noaa.gov/erddap/tabledap/FRDCPSTrawlLHHaulCatch.html
    status: approved
    enabled: true
    notes: >-
      Adult/juvenile trawl catch weights and counts (DEPM, ATM, SaKe). Implied zero-catch
      requires per-cruise evidence in config/cps_trawl_zero_frame_evidence.yaml.

  wcofs:
    module: fishai.ingestion.physics.sources.wcofs
    endpoint_family: NOAA WCOFS public S3
    license: U.S. Government Work
    license_url: https://www.noaa.gov/information-technology/foia
    attribution: "NOAA NOS CO-OPS West Coast Operational Forecast System (WCOFS)"
    pull_log_path: data/provenance/wcofs_pull_log.jsonl
    status: approved
    enabled: true

  glorys:
    module: fishai.ingestion.physics.sources.glorys
    license: Copernicus Marine Service
    license_url: https://marine.copernicus.eu/
    attribution: "Generated using E.U. Copernicus Marine Service Information; https://doi.org/10.48670/moi-00021"
    copernicus_doi: "10.48670/moi-00021"
    product_doi_label: GLORYS12V1
    status: approved
    enabled: true
    license_valid_until: 2028-06-30
    product_time_start: 1993-01-01
    product_time_end: 2026-06-23
    products:
      my:
        id: cmems_mod_glo_phy_my_0.083deg_P1D-m
        date_start: 1993-01-01
        date_end: 2021-06-30
      myint:
        id: cmems_mod_glo_phy_myint_0.083deg_P1D-m
        date_start: 2021-07-01
        date_end: 2026-06-23
    variables: [thetao, so, bottomT, mlotst, uo, vo, zos]
    pull_log_path: data/provenance/copernicus_pull_log.jsonl
    credentials_policy: personal_non_transferable_runtime_only
    use:
      allowed_purposes: [training, hindcast]
      forbidden_purposes: [daily_inference]
    notes: "Training/hindcast only. bottomT in feature store, not CUFES covariates. mlotst cross-check only."

  mur_sst:
    module: fishai.ingestion.physics.sources.sst
    erddap_dataset: jplMURSST41
    provider: NASA JPL MUR via NOAA CoastWatch ERDDAP
    license: U.S. Government Work
    license_url: https://www.jpl.nasa.gov/jpl-image-use-policy
    attribution: "These data were provided by JPL under support by NASA MEaSUREs program."
    status: approved
    enabled: true

  blended_sst:
    module: fishai.ingestion.physics.sources.sst
    erddap_dataset: noaacwBLENDEDsstDNDaily
    provider: NOAA Geo-Polar Blended SST via CoastWatch ERDDAP
    license: U.S. Government Work
    license_url: https://www.noaa.gov/information-technology/foia
    attribution: "NOAA/NESDIS; Office of Satellite Products and Operations"
    status: approved
    enabled: true

  ccmp_winds:
    module: fishai.ingestion.physics.sources.winds
    erddap_dataset: ccmp-daily-v2-1-NRT
    provider: RSS CCMP via NOAA PIFSC ERDDAP
    license: U.S. Government Work
    license_url: https://www.noaa.gov/information-technology/foia
    attribution: "Remote Sensing Systems"
    status: approved
    enabled: true

  ncep_winds:
    module: fishai.ingestion.physics.sources.winds
    erddap_dataset: ncep_global
    provider: NCEP GFS 10 m wind via PacIOOS ERDDAP
    license: U.S. Government Work
    license_url: https://www.noaa.gov/information-technology/foia
    attribution: "NOAA National Centers for Environmental Prediction (NCEP)"
    status: approved
    enabled: true

  altimetry_sla:
    module: fishai.ingestion.physics.sources.altimetry
    provider: NOAA CoastWatch blended SSH (future)
    license: U.S. Government Work
    license_url: https://www.noaa.gov/information-technology/foia
    attribution: "NOAA altimetry SLA; cite product and retrieval when enabled."
    status: pending
    enabled: false

  sccoos_hfr:
    module: fishai.ingestion.sensors.sccoos_hfr
    record_type: instrument
    erddap_dataset: ucsdHfrW6
    provider: NOAA IOOS Surface Currents Program (CoastWatch ERDDAP)
    license: ERDDAP dataset license (free use/redistribution; not for legal use)
    license_url: https://coastwatch.pfeg.noaa.gov/erddap/info/ucsdHfrW6/index.html
    attribution: "NOAA IOOS Surface Currents Program — Currents, HF Radar, US West Coast, RTV, Near-Real Time, Hourly, 6km (ERDDAP ucsdHfrW6, CoastWatch)."
    status: approved
    enabled: true

  ndbc_met:
    module: fishai.ingestion.sensors.ndbc_met
    record_type: instrument
    erddap_dataset: cwwcNDBCMet
    provider: NOAA NDBC / NOAA NMFS SWFSC ERD (CoastWatch ERDDAP)
    license: ERDDAP dataset license (free use/redistribution; not for legal use)
    license_url: https://coastwatch.pfeg.noaa.gov/erddap/info/cwwcNDBCMet/index.html
    attribution: "NOAA National Data Buoy Center — NDBC Standard Meteorological Buoy Data, 1970-present (ERDDAP cwwcNDBCMet; contributor NOAA NDBC, NOAA NMFS SWFSC ERD)."
    status: approved
    enabled: true

  ioos_glider_dac:
    module: fishai.ingestion.sensors.ioos_glider_dac
    record_type: instrument
    erddap_base: https://gliders.ioos.us/erddap
    provider: IOOS Glider DAC
    license: Pending ERDDAP NC_GLOBAL license confirmation
    license_url: https://gliders.ioos.us/erddap/info/index.html
    attribution: "Ingestion disabled until per-dataset ERDDAP NC_GLOBAL creator_name attribution is confirmed at enable time."
    status: pending
    enabled: false

  spray_glider:
    module: fishai.ingestion.sensors.spray_glider
    record_type: instrument
    erddap_base: https://spraydata.ucsd.edu/erddap/tabledap
    provider: Scripps Institution of Oceanography Spray gliders
    license: free use and redistribution (ERDDAP dataset terms)
    license_url: https://spraydata.ucsd.edu/erddap/info/index.html
    attribution: "Scripps Spray glider binned profiles (binnedCUGN80, binnedCUGN90) via ERDDAP tabledap."
    status: approved
    enabled: true
