# Runtime license manifest for pilot ingestion modules.
# Every ingestion source module must have a matching entry (CI-enforced).

pilot:
  name: Southern California Bight 50-mile nowcast
  bbox:
    lat_min: 32.0
    lat_max: 35.0
    lon_min: -121.0
    lon_max: -117.0

sources:
  calcofi_cufes:
    module: fishai.ingestion.biology.calcofi_cufes
    erddap_dataset: erdCalCOFIcufes
    provider: CalCOFI / SCCOOS ERDDAP
    license: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "CalCOFI and SCCOOS; cite ERDDAP dataset erdCalCOFIcufes and original CalCOFI data providers."
    status: approved
    enabled: true
    notes: Egg-stage evidence only; not adult presence.

  wcofs:
    module: fishai.ingestion.physics.wcofs
    endpoint_family: NOAA WCOFS public S3
    license: U.S. Government Work
    license_url: https://www.noaa.gov/information-technology/foia
    attribution: "NOAA National Ocean Service WCOFS; cite model run and retrieval time."
    status: approved
    enabled: true

  glorys:
    module: fishai.ingestion.physics.glorys
    product: Copernicus Marine GLORYS
    license: Copernicus Marine Service (account terms)
    license_url: https://marine.copernicus.eu/
    attribution: "Copernicus Marine Service GLORYS; cite product DOI and download credentials holder."
    status: account_required
    enabled: false

  sccoos_hfr:
    module: fishai.ingestion.sensors.sccoos_hfr
    record_type: instrument
    erddap_dataset: ucsdHfrW6
    provider: NOAA IOOS Surface Currents Program (CoastWatch ERDDAP)
    license: ERDDAP dataset license (free use/redistribution; not for legal use)
    license_url: https://coastwatch.pfeg.noaa.gov/erddap/info/ucsdHfrW6/index.html
    attribution: "NOAA IOOS Surface Currents Program — Currents, HF Radar, US West Coast, RTV, Near-Real Time, Hourly, 6km (ERDDAP ucsdHfrW6, CoastWatch)."
    status: approved
    enabled: true

  ndbc_met:
    module: fishai.ingestion.sensors.ndbc_met
    record_type: instrument
    erddap_dataset: cwwcNDBCMet
    provider: NOAA NDBC / NOAA NMFS SWFSC ERD (CoastWatch ERDDAP)
    license: ERDDAP dataset license (free use/redistribution; not for legal use)
    license_url: https://coastwatch.pfeg.noaa.gov/erddap/info/cwwcNDBCMet/index.html
    attribution: "NOAA National Data Buoy Center — NDBC Standard Meteorological Buoy Data, 1970-present (ERDDAP cwwcNDBCMet; contributor NOAA NDBC, NOAA NMFS SWFSC ERD)."
    status: approved
    enabled: true

  ioos_glider_dac:
    module: fishai.ingestion.sensors.ioos_glider_dac
    record_type: instrument
    erddap_base: https://gliders.ioos.us/erddap
    provider: IOOS Glider DAC
    license: Pending ERDDAP NC_GLOBAL license confirmation
    license_url: https://gliders.ioos.us/erddap/info/index.html
    attribution: "Ingestion disabled until per-dataset ERDDAP NC_GLOBAL creator_name attribution is confirmed at enable time."
    status: pending
    enabled: false
