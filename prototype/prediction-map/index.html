<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Southern California Bight — egg-encounter globe prototype</title>
    <script>
      // egg-encounter globe asset root
      window.CESIUM_BASE_URL =
        "https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/";
    </script>
    <link
      rel="stylesheet"
      href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
  </head>
  <body>
    <header>
      <p class="banner">Internal UX spike — egg-stage CUFES spawning-habitat visualization</p>
      <h1 id="map-title">Spawning-habitat egg-encounter globe</h1>
      <div id="species-toggle" aria-label="Species egg-encounter layer"></div>
    </header>
    <main class="layout">
      <div class="map-panel">
        <div
          id="globe"
          aria-label="Pilot domain egg-encounter globe 32–35°N 121–117°W"
        ></div>
        <p class="globe-watermark" data-testid="globe-watermark"></p>
      </div>
      <aside id="legend"></aside>
      <section id="cell-list" aria-label="Per-cell egg evidence state"></section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
