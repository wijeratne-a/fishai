[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fishai"
version = "0.1.0"
description = "Southern California Bight fish egg nowcast pilot skeleton"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fsspec==2024.10.0",
  "h5netcdf==1.4.1",
  "jsonschema==4.23.0",
  "netCDF4==1.7.2",
  "numcodecs==0.12.1",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "pyproj==3.7.0",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "scipy==1.14.1",
  "xarray==2024.11.0",
  "zarr==2.18.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]

[project.scripts]
fishai-bio = "fishai.cli:main_bio"
fishai-physics = "fishai.cli:main_physics"
fishai-sensors = "fishai.cli:main_sensors"
fishai-models = "fishai_models.cli:main"

[tool.setuptools.packages.find]
where = ["src", "python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
