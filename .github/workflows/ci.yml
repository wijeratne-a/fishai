name: CI

on:
  push:
    branches: [main, "feature/**", "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Sensitive data scan
        run: python security/precommit_sensitive_scan.py

      - name: No committed data binaries
        run: python scripts/ci/check_no_committed_data.py

      - name: Ingestion SOURCES manifest
        run: python scripts/ci/check_sources_manifest.py

      - name: Fishery-dependent schema fields
        run: python scripts/ci/check_fishery_schema_fields.py

      - name: Pytest
        run: pytest

  cufes-glorys-rebuild-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Compute CUFES×GLORYS cache key
        run: scripts/ci/compute_cufes_glorys_cache_key.sh | tee cache_key.txt

      - name: Hermetic cache restore tests
        run: pytest tests/ingestion/rebuild/test_cufes_glorys_artifact_cache.py

  cufes-glorys-rebuild-cache-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure cached CUFES×GLORYS rebuild image
        env:
          FISHAI_CUFES_GLORYS_REGISTRY: ghcr.io/${{ github.repository }}/cufes-glorys-rebuild
        run: |
          set +e
          EXTRACT=0 scripts/ci/ensure_cufes_glorys_rebuild_cache.sh
          status=$?
          if [[ "${status}" -eq 0 ]]; then
            echo "GHCR cache already present"
            exit 0
          fi
          if [[ ! -f "data/cache/cufes_glorys_rebuild_$(scripts/ci/compute_cufes_glorys_cache_key.sh).tar.gz" ]]; then
            echo "No local rebuild archive to publish; skipping (cold rebuild runs out-of-band)"
            exit 0
          fi
          PUBLISH=1 EXTRACT=0 scripts/ci/ensure_cufes_glorys_rebuild_cache.sh

  docker-r-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      r_base_tag: ${{ steps.ref.outputs.r_base_tag }}
      r_base_image: ${{ steps.ref.outputs.r_base_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute R base image ref
        id: ref
        run: |
          TAG="$(scripts/ci/compute_r_base_image_ref.sh)"
          echo "r_base_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "r_base_image=ghcr.io/${{ github.repository }}/r-env:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure cached R base image
        env:
          FISHAI_R_BASE_REGISTRY: ghcr.io/${{ github.repository }}/r-env
        run: scripts/ci/ensure_r_base_image.sh

      - name: Verify R base image label
        run: scripts/ci/verify_r_base_image.sh "${{ steps.ref.outputs.r_base_image }}"

  docker-r:
    needs: docker-r-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute R base image ref
        id: ref
        run: |
          TAG="$(scripts/ci/compute_r_base_image_ref.sh)"
          echo "r_base_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "r_base_image=ghcr.io/${{ github.repository }}/r-env:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified R base image
        run: |
          docker pull "${{ needs.docker-r-base.outputs.r_base_image }}"
          scripts/ci/verify_r_base_image.sh "${{ needs.docker-r-base.outputs.r_base_image }}"

      - name: Build modeling image
        run: |
          docker build \
            --build-arg "R_BASE_IMAGE=${{ needs.docker-r-base.outputs.r_base_image }}" \
            -t fishai-pilot .

      - name: Run Python and R tests in container
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker run --rm -e GIT_SHA="$GIT_SHA" fishai-pilot
