# Pre-registration: WCOFS vs GLORYS harmonization holdout scoring (pilot overlap window).
# Locked before any test-split observational pairing or model scoring runs.
# Nowcast-forcing PASS/DEGRADED/FAIL gates are defined in nowcast_forcing_grading below.

schema_version: 1

harmonization_wcofs_glorys:
  prereg_doc: prereg/harmonization_wcofs_glorys.md
  prereg_doc_git_path: prereg/harmonization_wcofs_glorys.md

  temporal_split:
    overlap_start: "2024-09-01"
    overlap_end: "2026-06-23"
    fit_start: "2024-09-01"
    fit_end: "2025-08-31"
    test_start: "2025-09-01"
    test_end: "2026-06-23"
    resolution: "WCOFS coarsened to GLORYS grid, area-weighted, wet-masked"
    coarsening_parity_note: >-
      The daily nowcast path must use the same single coarsening function as the
      overlap/holdout path so features are built identically.
    shared_functions:
      module: fishai.ingestion.physics.wcofs_glorys_grid
      coarsen_wcofs_to_glorys: coarsen_wcofs_to_glorys
      compute_wcofs_covariates_on_glorys_grid: compute_wcofs_covariates_on_glorys_grid
      requirement: >-
        Overlap/holdout scoring and the daily nowcast path must call these functions
        only; no duplicate coarsening or covariate builders.
    notes:
      last_fit_day: "2025-08-31"
      first_test_day: "2025-09-01"

  vertical_grid:
    depth_min_m: 0
    depth_max_m: 200
    depth_step_m: 1
    usage: >-
      Both WCOFS and GLORYS are placed on this 0–200 m, 1 m vertical grid before
      deriving T3m, S3m, and MLD_m.

  horizontal_processing:
    wcofs_coarsening:
      target: glorys_grid
      method: area_weighted_regrid
      area_weights: true
      wet_mask: true
      resolution: "WCOFS coarsened to GLORYS grid, area-weighted, wet-masked"
    area_weighted_definition:
      cell_weight: "1 / (pm * pn) for each WCOFS rho cell (ROMS curvilinear metric area)."
      glorys_boxes: >-
        Half-open GLORYS grid boxes so each WCOFS cell centre falls in exactly one
        destination box.
      wet_fraction: >-
        For each GLORYS cell and depth level, wet_fraction is the sum of WCOFS cell
        areas (same 1/(pm*pn) weights) that are wet (mask_rho) and reach that depth,
        divided by the box total area including land.
      nan_rule: >-
        Applies to coarsened WCOFS only (not GLORYS). Values are set to NaN where
        wet_fraction < min_wet_fraction.
      min_wet_fraction: 0.5
      applies_to: coarsened_wcofs_only
      glorys_training_note: >-
        CUFES training covariates come from GLORYS; min_wet_fraction never modifies
        GLORYS fields. No CUFES training event is excluded because of this rule; PR
        #5 must still load 14,592 kept events with GLORYS ocean data.
      config_equality: >-
        min_wet_fraction must equal regrid.min_wet_fraction in
        data/config/wcofs_glorys_overlap.yaml when that file is present in the repo.
    front_features:
      rule: >-
        WCOFS is coarsened to the GLORYS grid (area weights, wet mask) before
        front-related features (including sst_grad and front_distance_km) are computed.

  surface_definition:
    vertical_reference: >-
      SST, T3m, and S3m are measured as depth below the moving sea surface
      (zeta minus z_rho), not below the geoid datum.
    sst:
      target_depth_below_surface_m: 0.494
      glorys_note: GLORYS top model level (0.49 m) is the reference SST level.
      wcofs_rule: >-
        Where the top ROMS s_rho level is deeper than 0.494 m below the surface,
        use the top-level value at that level.
    t3m_s3m: Same moving-surface vertical reference as SST before interpolation to 3 m.
    shared_depth_function:
      module: fishai.ingestion.physics.wcofs_glorys_grid
      note: >-
        bot2 exposes one shared function for model temperature at depth below the
        moving surface; harmonization buoy scoring and all WCOFS rows use it so rows
        differ only in horizontal grid and mapping.

  glorys_reference_dataset:
    selection_rule: date_based_source_product_column
    note: >-
      Matches the existing CUFES covariate source_product column rule: finished
      reanalysis through 2021-06-30, interim from 2021-07-01 onward.
    products_by_calendar_date:
      - copernicus_product_id: cmems_mod_glo_phy_my_0.083deg_P1D-m
        through_date: "2021-06-30"
      - copernicus_product_id: cmems_mod_glo_phy_myint_0.083deg_P1D-m
        from_date: "2021-07-01"
    pilot_harmonization_window_uses: cmems_mod_glo_phy_myint_0.083deg_P1D-m
    coverage: every calendar date in fit_start through test_end (fit and test splits)

  variables:
    - name: T3m
      role: graded_input
    - name: S3m
      role: graded_input
    - name: MLD_m
      role: graded_input
    - name: sst_grad
      role: graded_input
    - name: front_distance_km
      role: graded_input
    - name: upwelling
      role: shared_forcing
      graded: false
      note: >-
        Reported when a single wind product covers CUFES training years and daily
        nowcasts; never graded because both GLORYS and WCOFS paths use the same wind
        (comparison would only test regridding).
      blank_when:
        reason: no_consistent_wind_product
        pilot_model_action: drop_upwelling_from_pilot_model
        exclude_events: false
    - name: u_surf
      role: report_only
    - name: v_surf
      role: report_only

  models_scored:
    scoring_split: test_only
    graded_model_row_for_forcing_gate: wcofs_coarsened_mapped
    forcing_gate_note: >-
      Only wcofs_coarsened_mapped receives PASS/DEGRADED/FAIL nowcast-forcing gates.
      Other model rows and HF radar remain report-only diagnostics.
    candidates:
      - id: wcofs_native
        description: Native ~4 km WCOFS grid and vertical handling per ingestion store.
        role: diagnostic_only
        harmonization_map: never
        note: >-
          Native 4 km WCOFS is scored only as a diagnostic row and is never passed
          through the harmonization map.
      - id: wcofs_coarsened_glorys_grid
        description: WCOFS coarsened to the GLORYS horizontal grid (area weights, wet mask).
      - id: wcofs_coarsened_mapped
        description: >-
          WCOFS coarsened to the GLORYS grid plus a bias/quantile-style correction
          fitted on the fit split only (fit_start through fit_end).
        correction_fit_window: fit
        forcing_gate_role: graded
      - id: glorys
        description: GLORYS reanalysis on its native grid (training/hindcast product).

  mapping_artifact:
    fitted_by: bot3
    delivery: later_pull_request
    summary: >-
      The WCOFS-to-GLORYS correction map is fitted by bot3 on the fit split only,
      in a later PR, then frozen for all downstream use.
    frozen_directory: artifacts/harmonization/wcofs_to_glorys_map/v1/
    manifest:
      filename: manifest.json
      location: artifacts/harmonization/wcofs_to_glorys_map/v1/manifest.json
      records:
        - fitting_commit_sha
        - fit_split_parquet_sha256
        - prereg_commit_sha
        - variables_mapped
        - fit_date_range
    fit_date_range:
      fit_start: "2024-09-01"
      fit_end: "2025-08-31"
    load_policy: >-
      Holdout scoring and the daily nowcast path may only load this frozen map;
      they must never refit or mutate it.

  observations:
    ndbc_hull_temperature:
      stations_manifest: docs/archive/legacy_data/globe_fixtures/stations.json
      variable: sea_water_temperature
      buoy_matching:
        applies_to_model_rows:
          - wcofs_native
          - wcofs_coarsened_glorys_grid
          - wcofs_coarsened_mapped
          - glorys
        model_depth_m: 0.494
        depth_reference: moving_sea_surface
        depth_function: >-
          bot2 single shared depth function in fishai.ingestion.physics.wcofs_glorys_grid
          (same as surface_definition.shared_depth_function); all four rows compare
          buoy temperature to model value 0.494 m below the moving sea surface so
          rows differ only in grid and harmonization mapping.
      match:
        spatial: nearest_glorys_cell
        temporal: same_day_daily_mean
      independence:
        wcofs_assimilates: false
        citation: NOAA Tech Report CO-OPS 097, p.17
        auditor_accepted: true
      forcing_gate:
        observation: buoy_temperature_at_0.494_m
        grades_model_row: wcofs_coarsened_mapped
        strata:
          - pooled
          - nearshore
          - offshore
        gradability:
          min_matched_daily_values: 100
          min_distinct_buoys: 3
          not_gradable_label: not_gradable
    sccoos_hf_radar:
      variables:
        - u_surf
        - v_surf
      aggregation: daily_cell_mean
      quality_mask:
        hdop_max: 1.25
        min_sites: 2
      forcing_gate_role: report_only
      report_only_reason: >-
        HF radar is assimilated by WCOFS; u_surf and v_surf are reported but never
        graded for nowcast forcing.
    scripps_spray_gliders:
      datasets:
        - id: binnedCUGN80
          license: free_to_use_and_redistribute
        - id: binnedCUGN90
          license: free_to_use_and_redistribute
      independence:
        accepted_independent_of_wcofs: true
        citation: NOAA Tech Report CO-OPS 097
        auditor_accepted: true
      forcing_gate:
        grades_model_row: wcofs_coarsened_mapped
        never_grades_model_rows:
          - glorys
      variables_graded:
        - id: MLD_m
        - id: temperature
          depth_m: 10
          label: stand_in_for_T3m
        - id: salinity
          depth_m: 10
          label: stand_in_for_S3m
      variables_report_only:
        - doxy
      model_sampling:
        rule: >-
          Model temperature, salinity, and MLD at the glider profile time and
          position; T and S at 10 m are interpolated from native s-levels (stand-in
          for 3 m covariates).
      gradability:
        min_matched_profiles: 100
        min_distinct_missions: 3
      mld_definition:
        module: fishai.ingestion.physics.vertical
        function: mld
        zref_m: 10
        dT_C: 0.2
        interpolated_threshold: true
        profile_not_reaching_drop:
          value: null
          reason: mld_not_reached
          exclude_from_mld_grading: true
      tests:
        rmse_ratio_to_glorys:
          same_rule_as: buoy_gate
          known_limitation: >-
            GLORYS may assimilate glider data, making a pass harder for WCOFS
            (conservative bias).
        absolute_bias_limits:
          temperature_10m_C: 0.5
          salinity_10m: 0.1
          MLD_m: 10
          source: auditor_judgment_not_published
          pass: within_limit
          degraded: between_1x_and_2x_limit
          fail: above_2x_limit
        pearson_r:
          same_rule_as: buoy_gate

  independence:
    assimilated_sources_registry: config/assimilated_sources.yaml
    rule: >-
      An observation source counts toward a model's score only when a versioned
      assimilated_sources.yaml entry, with a documented citation, shows that model
      does not assimilate that source.
    unknown_assimilation_status: >-
      Label not_independent; report in a separate stratum; never pool with
      confirmed-independent comparisons.
    hf_radar_wcofs_default: >-
      SCCOOS HF radar is presumed assimilated by WCOFS unless assimilated_sources.yaml
      documents otherwise.

  metrics:
    per_variable:
      - bias
      - rmse
      - pearson_r
    strata:
      seasons:
        - DJF
        - MAM
        - JJA
        - SON
      nearshore_offshore: true
      pooled: true
    reporting:
      each_stratum_includes:
        - n
        - block_bootstrap_ci_95
      block_bootstrap_block_days: 7
    front_detail_loss:
      definition: >-
        Mean sst_grad from coarsened WCOFS divided by mean sst_grad from native WCOFS
        on the same calendar days (test split when scoring holdout).
    season_labeling:
      test_split_jja: >-
        Test-split JJA is 2025-06-01 through 2025-06-23 only (partial June); label
        scores as test_split_jja_partial, not full-season JJA.
    common_support_scoring:
      rule: >-
        All four model rows (native WCOFS, coarsened, coarsened+mapped, GLORYS) are
        scored only on buoy and HF radar observation matches where every row has a
        finite model value at the matched time and location.
      dropped_observations:
        reason_label: insufficient_model_coverage
        reporting: >-
          Observation matches dropped because any model row is blanked are counted
          in the harmonization score report under insufficient_model_coverage, split
          nearshore/offshore (using the matched GLORYS cell nearshore flag).
      pass_fail_scope: >-
        auditbot1 pass/degraded cutoffs (when set) apply to this common-support
        observation set only, not to row-specific supersets.
      test_requirement: >-
        Scoring tests must assert that every model row uses the same observation
        count n within each metric stratum (season × nearshore/offshore × variable).

  map_product_labeling:
    required_label: egg encounter likelihood
    forbidden_labels:
      - spawning habitat
      - spawning locations
      - adult distribution
      - adult fish presence
    note: >-
      Harmonization and nowcast map products describe egg-stage encounter likelihood
      per the CUFES delta contract, not spawning habitat maps or adult distributions.

  frozen_shoreline_reference:
    path: data/reference/shoreline/ne_10m_land_pilot_clip.json
    sha256: 2f677a16aa6c8470846d813eda6d82f2656dea2d697b1511a4c878542d20996c
    frozen: true
    pr7_source_commit: 8d4bfae
    pr7_branch: cursor/wcofs-glorys-overlap-missing-by-field-60e8
    note: >-
      Auditor-cleared pilot shoreline vendored in PR #7; Bot4 scoring (PR #10) and
      other consumers must compare against frozen_shoreline_reference.sha256, not
      hard-coded hashes.

  nearshore:
    supplied_by: bot2
    bot2_pr: "PR #7 @ 8d4bfae"
    frozen_shoreline_reference_key: frozen_shoreline_reference
    shoreline_source: "Natural Earth ne_10m_land"
    shoreline_version: "5.1.1"
    license: "public domain"
    clip:
      lat_min: 31
      lat_max: 36
      lon_min: -122
      lon_max: -116
      includes_channel_islands: true
    shoreline_path: data/reference/shoreline/ne_10m_land_pilot_clip.json
    shoreline_simplification_note: >-
      Natural Earth 10 m land layer (ne_10m_land) clipped to the pilot box. PR #7
      (8d4bfae) uses an unsimplified clip-only shoreline (no Douglas–Peucker); fidelity
      work reports 0 GLORYS cells whose nearshore flag differs from the full coastline.
    cutoff_km: 20
    distance: >-
      Geodesic on WGS84 from each GLORYS cell centre to nearest mainland or island
      shoreline; nearshore when distance is cutoff_km or less.
    shoreline_simplification_check: TO_BE_SET_BEFORE_SCORING
    simplification_check_requirement: >-
      Records max coastline displacement and the count of GLORYS cells whose
      nearshore flag differs from full-resolution shoreline; required count is 0.
    scoring_gate_note: >-
      Scoring must refuse while shoreline_simplification_check remains
      TO_BE_SET_BEFORE_SCORING (bot2-owned). frozen_shoreline_reference is frozen;
      path and sha256 are authoritative for PR #10 shoreline checks.
    scoring_nearshore_assignment: >-
      Every NDBC buoy observation and SCCOOS HF radar grid cell inherits the
      nearshore/offshore flag of the GLORYS cell it is matched to for scoring, not
      its own geodesic distance to the coast. This rule applies identically to all
      four model rows in metrics strata, including native ~4 km WCOFS (diagnostic).

  nowcast_forcing_grading:
    graded_model_row: wcofs_coarsened_mapped
    verdict_rank_worst_first:
      - UNKNOWN
      - FAIL
      - DEGRADED
      - PASS
    combination_rules:
      per_stratum: worst_verdict_across_checks
      no_gradable_independent_check:
        cap_verdict: DEGRADED
        reason: no_independent_obs_check
      no_independent_validation_source:
        all_strata_verdict: UNKNOWN
        reason: no_independent_validation
    buoy_gate:
      rmse_ratio_to_glorys:
        pass:
          ratio_max: 1.2
          bootstrap_upper_95_max: 1.5
        degraded:
          ratio_min_exclusive: 1.2
          ratio_max_inclusive: 1.5
      absolute_bias_C:
        pass_max: 0.5
        degraded_min_exclusive: 0.5
        degraded_max_inclusive: 1.0
      pearson_r:
        pass_min_vs_glorys_r: within_0.10
      fail_outcome:
        verdict: UNKNOWN
        reason: nowcast_forcing_failed_holdout
    glider_gate:
      inherits_tests_from: observations.scripps_spray_gliders.tests
    graded_inputs_gate:
      graded_variable_names:
        - T3m
        - S3m
        - MLD_m
        - sst_grad
        - front_distance_km
      refuse_to_run_if_any_missing_from_variables: true
      reference_per_stratum: glorys_spatial_sd
      rmse_vs_glorys_sd:
        pass_max_multiple: 0.5
        degraded_max_multiple: 1.0
        fail_above_multiple: 1.0
      fail_stratum_verdict: UNKNOWN
      shared_forcing_variables_never_graded:
        - upwelling
      report_only_variables:
        - u_surf
        - v_surf

  upwelling_lags:
    applies_only_when: upwelling present in variables and not blanked
    candidates:
      - trailing_mean_days: 0
      - trailing_mean_days: 7
      - trailing_mean_days: 14
      - trailing_mean_days: 28
    window_end: day_before_event
    no_other_lags: true
    selection:
      method: time_forward_cv_mean_out_of_fold_log_likelihood
      fit_split_end: "2017-12-31"
      frozen_before: "2018-01-01"
      holdout_test_end: "2022-04-27"
      never_reselect_after_freeze: true
      auditor_accepted: true

  wet_fraction_reporting:
    scope: coarsened_wcofs_only
    read_only: true
    coverage_report_path: artifacts/harmonization/wcofs_glorys_overlap/coverage_report.json
    writer: bot2 overlap harmonization run
    report_contents: >-
      GLORYS-ocean cells where coarsened WCOFS is blanked by min_wet_fraction (0.5),
      split nearshore/offshore, at the surface and at each covariate depth level;
      CUFES kept events whose matched GLORYS cell falls in those cells, listed by
      event_id, counted against 14,592 kept events and separately against 13,326
      reduced-set events (short_event == FALSE). Counts are diagnostic only and do
      not change training exclusions or drop summaries.
    required_report_fields:
      - id: wcofs_nan_cell_count_nearshore
        description: Coarsened-WCOFS NaN cells (wet_fraction rule), nearshore, by level.
      - id: wcofs_nan_cell_count_offshore
        description: Same, offshore stratum.
      - id: cufes_events_in_wcofs_nan_cells_full
        description: Matched event_id list/count vs n_events = 14592 (read-only).
      - id: cufes_events_in_wcofs_nan_cells_reduced
        description: Same vs n_long_event = 13326 (short_event == FALSE, read-only).

  ocean_data_missing_rows:
    rule: >-
      Any covariate or training row whose own ocean forcing is actually missing (for
      any reason other than the coarsened-WCOFS wet_fraction diagnostic) stays in the
      table with excluded = TRUE and its documented drop reason; it is never converted
      to a zero count or silently removed.

  nowcast_insufficient_coverage:
    applies_to: coarsened_wcofs_wet_fraction_blanked_cells
    render_rule: >-
      Any nowcast grid cell blanked by the coarsened-WCOFS wet_fraction <
      min_wet_fraction rule carries evidence_state = UNKNOWN with reason
      insufficient_model_coverage, never a blank or missing tile.
    test_requirement: >-
      Automated test required in bot2/nowcast code (not in this prereg repo); this
      pre-registration records the requirement only.

  known_limitations:
    - id: mapped_wcofs_july_august_untested
      summary: >-
        July and August cells from mapped WCOFS are flagged untested until another
        summer is scored; in the one-year fit window they appear only as in-sample
        fit-year rows, not as holdout test-split rows.
    - id: interim_glorys_overlap
      summary: >-
        Harmonization fit and test splits use interim GLORYS
        (cmems_mod_glo_phy_myint_0.083deg_P1D-m) through 2026-06-23; finished
        GLORYS reanalysis (my) ends 2021-06-30.
    - id: single_fit_year
      summary: One fitting year (2024-09-01–2025-08-31) does not capture year-to-year variability.
    - id: indirect_buoy_glorys_product_check
      summary: >-
        Indirect check: finished GLORYS through 2021-06-30 vs interim GLORYS from
        2021-07-01 on the same long-record buoys, by season.
      indirect: true
      excluded_from_pass_rules: true
