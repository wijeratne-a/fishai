# Pre-registration: WCOFS vs GLORYS harmonization holdout scoring (pilot overlap window).
# Locked before any test-split observational pairing or model scoring runs.
# Threshold pass/degraded values are owned by auditbot1 and are not set here.

schema_version: 1

harmonization_wcofs_glorys:
  prereg_doc: prereg/harmonization_wcofs_glorys.md
  prereg_doc_git_path: prereg/harmonization_wcofs_glorys.md

  temporal_split:
    overlap_start: "2024-09-01"
    overlap_end: "2026-06-23"
    fit_start: "2024-09-01"
    fit_end: "2025-08-31"
    test_start: "2025-09-01"
    test_end: "2026-06-23"
    resolution: "WCOFS coarsened to GLORYS grid, area-weighted, wet-masked"
    coarsening_parity_note: >-
      The daily nowcast path must use the same single coarsening function as the
      overlap/holdout path so features are built identically.
    notes:
      last_fit_day: "2025-08-31"
      first_test_day: "2025-09-01"

  vertical_grid:
    depth_min_m: 0
    depth_max_m: 200
    depth_step_m: 1
    usage: >-
      Both WCOFS and GLORYS are placed on this 0–200 m, 1 m vertical grid before
      deriving T3m, S3m, and MLD_m.

  horizontal_processing:
    wcofs_coarsening:
      target: glorys_grid
      method: area_weighted_regrid
      area_weights: true
      wet_mask: true
      resolution: "WCOFS coarsened to GLORYS grid, area-weighted, wet-masked"
    front_features:
      rule: >-
        WCOFS is coarsened to the GLORYS grid (area weights, wet mask) before
        front-related features (including sst_grad and front_distance_km) are computed.

  variables:
    - T3m
    - S3m
    - MLD_m
    - sst_grad
    - front_distance_km
    - u_surf
    - v_surf

  models_scored:
    scoring_split: test_only
    candidates:
      - id: wcofs_native
        description: Native ~4 km WCOFS grid and vertical handling per ingestion store.
        role: diagnostic_only
        harmonization_map: never
        note: >-
          Native 4 km WCOFS is scored only as a diagnostic row and is never passed
          through the harmonization map.
      - id: wcofs_coarsened_glorys_grid
        description: WCOFS coarsened to the GLORYS horizontal grid (area weights, wet mask).
      - id: wcofs_coarsened_mapped
        description: >-
          WCOFS coarsened to the GLORYS grid plus a bias/quantile-style correction
          fitted on the fit split only (fit_start through fit_end).
        correction_fit_window: fit
      - id: glorys
        description: GLORYS reanalysis on its native grid (training/hindcast product).

  mapping_artifact:
    fitted_by: bot3
    delivery: later_pull_request
    summary: >-
      The WCOFS-to-GLORYS correction map is fitted by bot3 on the fit split only,
      in a later PR, then frozen for all downstream use.
    frozen_directory: artifacts/harmonization/wcofs_to_glorys_map/v1/
    manifest:
      filename: manifest.json
      location: artifacts/harmonization/wcofs_to_glorys_map/v1/manifest.json
      records:
        - fitting_commit_sha
        - fit_split_parquet_sha256
        - prereg_commit_sha
        - variables_mapped
        - fit_date_range
    fit_date_range:
      fit_start: "2024-09-01"
      fit_end: "2025-08-31"
    load_policy: >-
      Holdout scoring and the daily nowcast path may only load this frozen map;
      they must never refit or mutate it.

  observations:
    ndbc_hull_temperature:
      stations_manifest: docs/archive/legacy_data/globe_fixtures/stations.json
      variable: sea_water_temperature
      match:
        glorys_model_level_depth_m: 0.49
        wcofs_model_level: nearest_to_1m
        spatial: nearest_glorys_cell
        temporal: same_day_daily_mean
    sccoos_hf_radar:
      variables:
        - u_surf
        - v_surf
      aggregation: daily_cell_mean
      quality_mask:
        hdop_max: 1.25
        min_sites: 2
    ioos_glider_dac:
      status: excluded
      reason: >-
        Glider feed excluded while IOOS Glider DAC remains pending/disabled in
        data/SOURCES.yaml; no glider rows enter harmonization scores.

  independence:
    assimilated_sources_registry: config/assimilated_sources.yaml
    rule: >-
      An observation source counts toward a model's score only when a versioned
      assimilated_sources.yaml entry, with a documented citation, shows that model
      does not assimilate that source.
    unknown_assimilation_status: >-
      Label not_independent; report in a separate stratum; never pool with
      confirmed-independent comparisons.
    hf_radar_wcofs_default: >-
      SCCOOS HF radar is presumed assimilated by WCOFS unless assimilated_sources.yaml
      documents otherwise.

  metrics:
    per_variable:
      - bias
      - rmse
      - pearson_r
    strata:
      seasons:
        - DJF
        - MAM
        - JJA
        - SON
      nearshore_offshore: true
      pooled: true
    reporting:
      each_stratum_includes:
        - n
        - block_bootstrap_ci_95
      block_bootstrap_block_days: 7
    front_detail_loss:
      definition: >-
        Mean sst_grad from coarsened WCOFS divided by mean sst_grad from native WCOFS
        on the same calendar days (test split when scoring holdout).
    season_labeling:
      test_split_jja: >-
        Test-split JJA is 2025-06-01 through 2025-06-23 only (partial June); label
        scores as test_split_jja_partial, not full-season JJA.

  nearshore:
    supplied_by: bot2
    shoreline_source: >-
      Natural Earth 10m land polygons (ne_10m_land, public domain, includes the
      Channel Islands), clipped to lat 31 to 36 and lon -122 to -116.
    nearshore_cutoff_km: 20
    nearshore_rule: >-
      A GLORYS cell is nearshore when the geodesic distance from its cell centre
      to the nearest mainland or island shoreline is 20 km or less.
    shoreline_version: TO_BE_SET_BEFORE_SCORING
    shoreline_sha256: TO_BE_SET_BEFORE_SCORING
    version_hash_note: >-
      bot2 will post the exact Natural Earth version and shoreline file SHA-256;
      the scoring guard must refuse while shoreline_version or shoreline_sha256
      remain unset.

  pass_fail_thresholds:
    owner: auditbot1
    cutoffs: TO_BE_SET_BEFORE_SCORING
    gating: >-
      No production or audit pass/degraded gating until auditbot1 replaces cutoffs;
      metrics are reported descriptively only while cutoffs remain unset.

  known_limitations:
    - id: mapped_wcofs_july_august_untested
      summary: >-
        July and August cells from mapped WCOFS are flagged untested until another
        summer is scored; in the one-year fit window they appear only as in-sample
        fit-year rows, not as holdout test-split rows.
    - id: interim_glorys_overlap
      summary: >-
        The scored overlap window uses interim GLORYS product coverage through
        2026-06-23; finished GLORYS reanalysis ends 2021-06-30.
    - id: single_fit_year
      summary: One fitting year (2024-09-01–2025-08-31) does not capture year-to-year variability.
    - id: indirect_buoy_glorys_product_check
      summary: >-
        Indirect check: finished GLORYS through 2021-06-30 vs interim GLORYS from
        2021-07-01 on the same long-record buoys, by season.
      indirect: true
      excluded_from_pass_rules: true
