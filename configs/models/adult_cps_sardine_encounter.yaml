fishai_engine_config:
  version: "1.0"
  species:
    code: SARD
    name: Pacific sardine
    taxon: sardine
    scientific_name: Sardinops sagax
  domain:
    lat_min: 32.0
    lat_max: 35.0
    lon_min: -121.0
    lon_max: -117.0
  training:
    observation_source_id: swfsc_cps_adult
    covariate_forcing_source_id: glorys
  data:
    loader: adult_cps
    table_path: data/processed/adult_cps/adult_cps_training_table.parquet
    events_path: data/processed/adult_cps/adult_cps_events.parquet
    covariate_drops_path: data/processed/adult_cps/adult_cps_training_covariate_drops.parquet
    covariate_drop_summary_path: data/processed/adult_cps/adult_cps_training_covariate_drop_summary.json
    time_idx_origin: "1990-01-01"
    time_idx_dense_remap: true
    source_id: swfsc_cps_adult
    spatial_block_cv:
      n_folds: 4
    fold_assignment_path: artifacts/spatial_block_cv/adult_cps_fold_assignment.csv
  covariates:
    forcing_source_id: glorys
    depth_sample_m: 3
    dynamic:
      - temp_3m
      - sal_3m
      - mld
      - sst_grad
      - dist_front
    static:
      - log_depth
    excluded:
      - bottomT
    upstream_fields:
      temp_3m: T3m
      sal_3m: S3m
      mld: MLD_m
      sst_grad: sst_grad
      dist_front: front_distance_km
      log_depth: bottom_depth_m
  response:
    type: encounter
    column: encounter
    effort_column: effort_duration_min
  model:
    engine: sdmTMB
    family: binomial
    link: logit
    formula_shared: >-
      ~ s(temp_3m_z, k = 3) + s(sal_3m_z, k = 3) + s(mld_z, k = 3)
      + s(sst_grad_z, k = 3) + s(dist_front_z, k = 3)
      + s(log_depth_z, k = 3)
    spatial: [off, off]
    spatiotemporal: [off, off]
    time_varying:
      formula: "~ 1"
      type: rw0
  mesh:
    cutoff_km: 9
    range_guess_km: 60
    barrier:
      enabled: true
      range_fraction: 0.1
      land_sf_rds: data/reference/mesh/scb_pilot_land_sf.rds
  prediction:
    nsim: 50
    seed: 20260928
    grid_table: src/models/tests/fixtures/synthetic_grid.csv
    inference_forcing_source_id: glorys
  ood:
    mess_mask_below: -20
    hull_pairs:
      - [temp_3m_z, sal_3m_z]
  output:
    dir: artifacts/models/adult_sardine_encounter
