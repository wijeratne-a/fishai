fishai_engine_config:
  version: "1.0"
  species:
    code: HERR
    name: Pacific herring (all sizes)
    taxon: herring
    scientific_name: Clupea pallasii
    product_label: Pacific herring encounter probability (all sizes)
  domain:
    lat_min: 32.0
    lat_max: 45.0
    lon_min: -125.0
    lon_max: -117.0
  training:
    observation_source_id: swfsc_cps_adult
    covariate_forcing_source_id: glorys
  data:
    loader: adult_cps
    table_path: data/processed/adult_cps_herring/herring_all_sizes_training_table.parquet
    events_path: data/processed/adult_cps_herring/herring_all_sizes_events.parquet
    covariate_drops_path: data/processed/adult_cps_herring/herring_all_sizes_covariate_drops.parquet
    covariate_drop_summary_path: data/processed/adult_cps_herring/herring_all_sizes_covariate_drop_summary.json
    time_idx_origin: "1990-01-01"
    time_idx_dense_remap: true
    source_id: swfsc_cps_adult
    spatial_block_cv:
      n_folds: 4
    fold_assignment_path: artifacts/spatial_block_cv/adult_herring_fold_assignment.csv
  covariates:
    forcing_source_id: glorys
    depth_sample_m: 3
    dynamic:
      - temp_3m
      - sal_3m
      - mld
      - sst_grad
      - dist_front
    static:
      - log_depth
    excluded:
      - bottomT
    upstream_fields:
      temp_3m: T3m
      sal_3m: S3m
      mld: MLD_m
      sst_grad: sst_grad
      dist_front: front_distance_km
      log_depth: bottom_depth_m
  response:
    type: encounter_binomial
    column: encounter
    effort_column: effort_duration_min
  model:
    engine: sdmTMB
    family: binomial
    formula_shared: >-
      ~ s(temp_3m_z, k = 3) + s(sal_3m_z, k = 3) + s(mld_z, k = 3)
      + s(sst_grad_z, k = 3) + s(dist_front_z, k = 3)
      + s(log_depth_z, k = 3)
    spatial: on
    spatiotemporal: "off"
    time_varying:
      formula: "~ 1"
      type: rw0
    priors:
      pc_matern:
        range_gt_mult_max_edge: 2
        sigma_lt: 2
  mesh:
    cutoff_km: 9
    range_guess_km: 60
    barrier:
      enabled: false
  prediction:
    nsim: 50
    seed: 20260928
  output:
    dir: artifacts/models/adult_herring
