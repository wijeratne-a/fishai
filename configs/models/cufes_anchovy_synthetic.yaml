fishai_engine_config:
  version: "1.0"
  species:
    code: ANCH
    name: Northern anchovy
    taxon: anchovy
  domain:
    lat_min: 32.0
    lat_max: 35.0
    lon_min: -121.0
    lon_max: -117.0
  training_end: "2021-12-31"
  training:
    observation_source_id: calcofi_cufes
    covariate_forcing_source_id: glorys
  data:
    events_path: src/models/tests/fixtures/synthetic_cufes_events.csv
    counts_path: src/models/tests/fixtures/synthetic_cufes_counts.csv
    covariates_path: src/models/tests/fixtures/synthetic_cufes_covariates.csv
    covariate_drops_path: src/models/tests/fixtures/synthetic_covariate_drops.csv
    covariate_drop_summary_path: src/models/tests/fixtures/synthetic_covariate_drop_summary.json
    source_id: calcofi_cufes
    spatial_block_cv:
      n_folds: 4
  covariates:
    forcing_source_id: glorys
    depth_sample_m: 3
    dynamic:
      - temp_3m
      - sal_3m
      - mld
      - sst_grad
      - dist_front
      - upwelling
    static:
      - log_depth
    excluded:
      - bottomT
  response:
    type: density_delta
    column: egg_count
    effort_column: volume_m3
  model:
    engine: sdmTMB
    family: delta_gamma
    delta_type: poisson-link
    formula_shared: >-
      ~ s(temp_3m_z, k = 3) + s(sal_3m_z, k = 3) + s(mld_z, k = 3)
      + s(sst_grad_z, k = 3) + s(dist_front_z, k = 3) + s(upwelling_z, k = 3)
      + s(log_depth_z, k = 3)
    spatial: [on, on]
    spatiotemporal: [iid, off]
    share_range: [true, true]
    time_varying:
      formula: "~ 1"
      type: rw0
    priors:
      pc_matern:
        range_gt_mult_max_edge: 2
        sigma_lt: 2
  mesh:
    cutoff_km: 18
    range_guess_km: 60
    barrier:
      enabled: false
      range_fraction: 0.1
  prediction:
    nsim: 50
    seed: 20260928
    grid_table: src/models/tests/fixtures/synthetic_grid.csv
    inference_forcing_source_id: glorys
  ood:
    mess_mask_below: -20
    hull_pairs:
      - [temp_3m_z, sal_3m_z]
  output:
    dir: artifacts/models/anchovy
